<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyTrack — Sala de Estudos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: { brand: { 500: '#6366f1', 600: '#4f46e5' } },
        },
      },
    };
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    @keyframes entradaCard {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 transition-colors duration-300 min-h-screen">

  <header class="border-b border-slate-200 dark:border-slate-800 px-6 py-4 flex items-center justify-between">
    <a href="dashboard.html" class="text-sm text-slate-500 dark:text-slate-400 hover:text-brand-500 transition-colors">← Voltar</a>
    <h1 class="text-lg font-bold text-brand-600 dark:text-brand-500">Sala de Estudos</h1>
    <div class="flex items-center gap-2">
      <button id="btn-audio" class="p-2 rounded-full bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors">
        <i data-lucide="music" class="w-5 h-5"></i>
      </button>
      <button id="btn-configuracoes" class="p-2 rounded-full bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors">
        <i data-lucide="settings" class="w-5 h-5"></i>
      </button>
      <button id="toggle-tema" class="p-2 rounded-full bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors">
        <span id="icone-tema">🌙</span>
      </button>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-6 py-10">

    <!-- Seleção de tema (aparece antes de iniciar) -->
    <div id="secao-selecao-tema" class="text-center">
      <p class="text-lg font-medium mb-4">O que você vai estudar agora?</p>
      <select id="select-tema" class="w-full max-w-xs mx-auto px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800 mb-4">
        <option value="">Selecione um tema...</option>
      </select>
      <br />
      <button id="btn-comecar" disabled
        class="px-6 py-2.5 rounded-lg bg-brand-600 hover:bg-brand-500 disabled:opacity-40 disabled:cursor-not-allowed text-white font-medium transition-all active:scale-95">
        Começar
      </button>
    </div>

    <!-- Cronômetro (escondido até escolher o tema) -->
    <div id="secao-timer" class="hidden text-center">
      <div class="relative w-72 h-72 sm:w-96 sm:h-96 md:w-[28rem] md:h-[28rem] mx-auto mb-8">
        <svg class="transform -rotate-90 w-full h-full" viewBox="0 0 300 300">
          <!-- trilha de fundo, sempre visível por completo -->
          <circle cx="150" cy="150" r="130" stroke-width="14" fill="none"
            class="text-slate-200 dark:text-slate-700" stroke="currentColor" />
          <!-- anel de progresso — o JS controla quanto dele aparece via stroke-dashoffset -->
          <circle id="anel-progresso" cx="150" cy="150" r="130" stroke-width="14" fill="none"
            stroke-linecap="round" class="text-brand-600 dark:text-brand-500" stroke="currentColor"
            style="transition: stroke-dashoffset 1s linear;" />
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <p id="label-fase" class="text-sm uppercase tracking-widest text-slate-500 dark:text-slate-400 mb-2 font-medium">Foco</p>
          <p id="display-tempo" class="text-6xl sm:text-7xl md:text-8xl font-extrabold tabular-nums text-slate-900 dark:text-white">25:00</p>
        </div>
      </div>

      <div class="flex items-center justify-center gap-3 mb-10">
        <button id="btn-abrir-anotacao" title="Fazer anotação"
          class="w-12 h-12 rounded-full border border-slate-200 dark:border-slate-600 flex items-center justify-center text-slate-500 dark:text-slate-400 hover:text-brand-500 hover:border-brand-500 transition-all active:scale-95">
          <i data-lucide="pencil-line" class="w-5 h-5"></i>
        </button>

        <button id="btn-iniciar-pausar"
          class="px-10 py-3.5 rounded-full bg-brand-600 hover:bg-brand-500 text-white font-semibold text-base transition-all active:scale-95 shadow-lg shadow-brand-600/30">
          Iniciar
        </button>

        <button id="btn-pular" title="Pular"
          class="w-12 h-12 rounded-full border border-slate-200 dark:border-slate-600 flex items-center justify-center text-slate-500 dark:text-slate-400 hover:text-brand-500 hover:border-brand-500 transition-all active:scale-95">
          <i data-lucide="skip-forward" class="w-5 h-5"></i>
        </button>

        <button id="btn-encerrar" title="Encerrar"
          class="w-12 h-12 rounded-full border border-slate-200 dark:border-slate-600 flex items-center justify-center text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 transition-all active:scale-95">
          <i data-lucide="square" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="max-w-sm mx-auto mb-10 text-left">
        <h3 class="text-sm font-medium text-slate-500 dark:text-slate-400 mb-3">Tarefas</h3>

        <div id="lista-tarefas" class="space-y-2 mb-3">
          <!-- tarefas entram aqui via JS -->
        </div>

        <form id="form-nova-tarefa" class="flex gap-2">
          <input type="text" id="input-nova-tarefa" placeholder="Adicionar tarefa..."
            class="flex-1 px-3 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500" />
          <button type="submit" class="px-3 py-2 rounded-lg bg-brand-600 hover:bg-brand-500 text-white transition-all active:scale-95">
            <i data-lucide="plus" class="w-4 h-4"></i>
          </button>
        </form>
      </div>

      <!-- Painel de áudio: mesmo padrão visual do painel de configurações -->
  <div id="painel-audio" class="hidden fixed inset-0 z-50">
    <div id="overlay-audio" class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>

    <div id="painel-audio-conteudo" class="absolute right-0 top-0 h-full w-full max-w-sm bg-white dark:bg-slate-800 shadow-2xl p-6 overflow-y-auto transform transition-transform duration-300 translate-x-full">
      <div class="flex items-center justify-between mb-6">
        <h3 class="text-lg font-semibold">Música e sons</h3>
        <button id="btn-fechar-audio" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Player de música lofi (YouTube embed) -->
      <!-- Mini player de música lofi — pequeno e discreto de propósito, para não competir
           visualmente com o cronômetro, que é o foco real da tela -->
      <!-- Player de música: escondido por padrão, revelado sob demanda,
           para não competir visualmente com o cronômetro -->
     <!-- Abas de fonte de áudio: só uma seção fica visível por vez -->
        <div class="flex gap-1 justify-center mb-4 bg-slate-100 dark:bg-slate-700 rounded-lg p-1 max-w-xs mx-auto">
          <button data-aba="radio" class="btn-aba-audio flex-1 py-1.5 text-xs rounded-md font-medium transition-all">📻 Rádio</button>
          <button data-aba="youtube" class="btn-aba-audio flex-1 py-1.5 text-xs rounded-md font-medium transition-all">▶️ YouTube</button>
          <button data-aba="ambiente" class="btn-aba-audio flex-1 py-1.5 text-xs rounded-md font-medium transition-all">🌊 Ambiente</button>
        </div>

        <!-- Aba: Rádio (SomaFM) -->
        
        <div id="aba-radio" class="aba-audio max-w-xs mx-auto">
          <!-- Tag de áudio com o link de stream direto (.mp3) -->
          <audio id="audio-radio" src="https://ice1.somafm.com/groovesalad-128-mp3"></audio>
          
          <div class="flex items-center gap-2 mb-3">
            <select id="select-radio" class="flex-1 px-3 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800">
              <option value="https://ice1.somafm.com/groovesalad-128-mp3">Groove Salad — ambient/downtempo</option>
              <option value="https://ice1.somafm.com/dronezone-128-mp3">Drone Zone — atmosférico</option>
              <option value="https://ice1.somafm.com/illstreet-128-mp3">Illinois Street Lounge — jazzy lofi</option>
            </select>
            <button id="btn-play-radio" class="px-4 py-2 text-sm rounded-lg bg-brand-600 hover:bg-brand-500 text-white font-medium transition-all active:scale-95">▶</button>
          </div>
        </div>

        <!-- Aba: YouTube -->
        <div id="aba-youtube" class="aba-audio max-w-xs mx-auto hidden">
          <div class="flex gap-2 mb-3">
            <input type="text" id="input-link-musica" placeholder="Cole um link do YouTube..."
              class="flex-1 px-3 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800" />
            <button id="btn-carregar-musica" class="px-3 py-2 text-sm rounded-lg bg-brand-600 hover:bg-brand-500 text-white font-medium transition-all active:scale-95">Carregar</button>
          </div>
          <select id="select-musica" class="w-full mb-3 px-3 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800">
            <option value="jfKfPfyJRdk">Lofi Girl — beats para relaxar/estudar</option>
            <option value="rUxyKA_-grg">Lofi Girl — beats para dormir/relaxar</option>
            <option value="4xDzrJKXOOY">Coffee Shop Radio — ambiente lofi</option>
          </select>
          <div id="video-wrapper" class="rounded-xl overflow-hidden shadow-md transition-all duration-300 max-h-96 opacity-100" style="max-width: 200px; margin: 0 auto;">
            <div id="player-youtube" class="w-full aspect-video"></div>
          </div>
          <button id="btn-toggle-video" class="text-sm text-slate-500 dark:text-slate-400 hover:text-brand-500 transition-colors mt-2">🎵 Esconder vídeo (música continua)</button>
        </div>

        <!-- Aba: Sons ambiente gerados -->
        <div id="aba-ambiente" class="aba-audio max-w-xs mx-auto hidden">
          <div class="flex gap-2 justify-center mb-3">
            <button id="btn-ruido-branco" data-tipo="branco" class="btn-som-ambiente px-4 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700 transition-all">🌊 Ruído branco</button>
            <button id="btn-chuva" data-tipo="chuva" class="btn-som-ambiente px-4 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700 transition-all">🌧️ Chuva</button>
          </div>
        </div>

        <!-- Volume: compartilhado entre as três abas -->
        <div class="flex items-center gap-2 mt-3 max-w-xs mx-auto">
          <span class="text-sm">🔈</span>
          <input type="range" id="input-volume" min="0" max="100" value="50" class="flex-1" />
          <span class="text-sm">🔊</span>
        </div>
      </div>

    </div>
  </div>

      <div id="modal-resumo" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center px-4 z-50">
    <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 w-full max-w-sm shadow-2xl">
      <h3 class="text-lg font-semibold mb-1">Sessão encerrada 🎉</h3>
      <p id="resumo-tempo-total" class="text-sm text-slate-500 dark:text-slate-400 mb-4"></p>
      <label class="block text-sm font-medium mb-1">O que você estudou? (opcional)</label>
      <textarea id="input-resumo-sessao" rows="3" placeholder="Ex: revisei closures e escopo, fiz 5 exercícios..."
        class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500 resize-none mb-4"></textarea>
      <button id="btn-salvar-resumo" class="w-full py-2.5 rounded-lg bg-brand-600 hover:bg-brand-500 text-white font-medium transition-all active:scale-95">
        Salvar e voltar ao dashboard
      </button>
    </div>
  </div>

  <div id="modal-anotacao" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center px-4 z-50">
    <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 w-full max-w-sm shadow-2xl">
      <h3 class="text-lg font-semibold mb-4">Anotação da sessão</h3>
      <textarea id="input-anotacao-modal" rows="5" placeholder="O que você está aprendendo agora?"
        class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500 resize-none mb-4"></textarea>
      <div class="flex gap-2">
        <button id="btn-cancelar-anotacao" class="flex-1 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 font-medium hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
          Cancelar
        </button>
        <button id="btn-salvar-anotacao" class="flex-1 py-2.5 rounded-lg bg-brand-600 hover:bg-brand-500 text-white font-medium transition-all active:scale-95">
          Salvar anotação
        </button>
      </div>
    </div>
  </div>

  <!-- Painel de configurações: desliza da direita, com overlay escurecendo o fundo -->
  <div id="painel-configuracoes" class="hidden fixed inset-0 z-50">
    <div id="overlay-configuracoes" class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>

    <div id="painel-conteudo" class="absolute right-0 top-0 h-full w-full max-w-sm bg-white dark:bg-slate-800 shadow-2xl p-6 overflow-y-auto transform transition-transform duration-300 translate-x-full">
      <div class="flex items-center justify-between mb-6">
        <h3 class="text-lg font-semibold">Configurações</h3>
        <button id="btn-fechar-configuracoes" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="mb-6">
        <h4 class="text-xs font-medium uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-3">Timer</h4>

        <div class="flex items-center justify-between mb-3">
          <span class="text-sm">Duração do foco</span>
          <div class="flex items-center gap-2">
            <button data-campo="foco" data-delta="-5" class="btn-ajustar-tempo w-8 h-8 rounded-full border border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">−</button>
            <span id="valor-foco" class="w-16 text-center font-medium">25 min</span>
            <button data-campo="foco" data-delta="5" class="btn-ajustar-tempo w-8 h-8 rounded-full border border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">+</button>
          </div>
        </div>

        <div class="flex items-center justify-between">
          <span class="text-sm">Duração da pausa</span>
          <div class="flex items-center gap-2">
            <button data-campo="pausa" data-delta="-1" class="btn-ajustar-tempo w-8 h-8 rounded-full border border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">−</button>
            <span id="valor-pausa" class="w-16 text-center font-medium">5 min</span>
            <button data-campo="pausa" data-delta="1" class="btn-ajustar-tempo w-8 h-8 rounded-full border border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">+</button>
          </div>
        </div>
      </div>

      <!-- Gancho pra personalização visual, que fica pro backlog -->
      <div class="border-t border-slate-200 dark:border-slate-700 pt-6">
        <h4 class="text-xs font-medium uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-3">Aparência</h4>
        <p class="text-sm text-slate-400">Em breve</p>
      </div>
    </div>
  </div>

  </main>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="js/tema.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pomodoro.js"></script>
</body>
</html>
